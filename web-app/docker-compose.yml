name: ai-usage-web

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_usage}
      POSTGRES_USER: ${POSTGRES_USER:-ai_usage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_usage} -d ${POSTGRES_DB:-ai_usage}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [private]

  api:
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: Europe/Rome
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-ai_usage}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ai_usage}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4400}
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
    volumes:
      - ./storage/uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private, public]
    ports:
      - "${API_PORT:-3000}:3000"

  worker:
    build:
      context: ./backend
      target: production
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: Europe/Rome
      DATABASE_URL: postgresql://${POSTGRES_USER:-ai_usage}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ai_usage}
      UPLOAD_DIR: /data/uploads
      OCR_CACHE_DIR: /opt/ocr-cache
      OCR_POLL_INTERVAL_MS: ${OCR_POLL_INTERVAL_MS:-2000}
    volumes:
      - ./storage/uploads:/data/uploads
    depends_on:
      api:
        condition: service_healthy
    networks: [private]

  frontend:
    build:
      context: ./frontend
      args:
        PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000/api}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-4400}:80"
    networks: [public]

volumes:
  postgres-data:

networks:
  private:
    internal: true
  public:
